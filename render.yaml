services:
  - type: web
    name: seqa-security-service
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: VIOLATION_THRESHOLD
        value: "3"
      - key: BLOCK_DURATION_MS
        value: "300000"
      - key: MAX_REQUEST_LOGS
        value: "10000"
      - key: ADMIN_API_KEY
        value: admin-secret-key-2026
